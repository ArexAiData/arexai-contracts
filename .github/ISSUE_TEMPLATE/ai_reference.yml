name: AI reference or analysis behavior
description: Report a synthetic example mismatch or document an analysis limitation
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only. This repository publishes reference examples; the application implementation is separate. Report exploitable security issues privately to info@arexaidata.com."
  - type: input
    id: version
    attributes:
      label: Product version, language and example
      description: Include the application version or repository commit and the example file path.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Minimal synthetic reproduction
      description: Include headers, a few artificial rows, row meaning, units, status definitions, selected date/duration format and filters.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Provide the calculation and source coordinates; identify whether the mismatch is in the reference fixture or application.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: This report contains only synthetic data and no personal information, customer files or credentials.
          required: true
