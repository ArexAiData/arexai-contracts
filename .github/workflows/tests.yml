name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardhat-tests:
    name: Contract behavioral suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.13.0

      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify deployment registry integrity
        run: npm run verify:registry

      - name: Reproduce creation and deployed bytecode snapshot
        run: npm run verify:bytecode

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm test

  required-check-compatibility:
    # The repository ruleset still requires this historical check context.
    # This alias can pass only after the current behavioral test job succeeds.
    name: Hardhat 37-test suite
    needs: hardhat-tests
    runs-on: ubuntu-latest
    steps:
      - name: Confirm current contract suite passed
        run: echo "The required Hardhat behavioral suite completed successfully."
