name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardhat-tests:
    name: Contract behavioral suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0

      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit installed dependencies (high and critical gate)
        run: npm run audit:dependencies

      - name: Verify deployment registry integrity
        run: npm run verify:registry

      - name: Reproduce creation and deployed bytecode snapshot
        run: npm run verify:bytecode

      - name: Verify generated deployment documentation
        run: npm run verify:docs

      - name: Reproduce frozen live staking evidence
        run: npm run verify:staking-mainnet

      - name: Check recorded project consistency and rejection scenarios
        run: |
          npm run verify:consistency
          npm run test:consistency

      - name: Verify synthetic AI reference examples
        run: npm run verify:ai-examples

      - name: Exercise reviewer package rejection scenarios
        run: npm run test:tooling

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        env:
          STAKING_LOAD_REPORT: ci-evidence/staking-load.json
          STAKING_BOUNDARY_REPORT: ci-evidence/staking-boundary.json
          STAKING_FROZEN_LOAD_REPORT: ci-evidence/staking-frozen-load.json
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          npm test 2>&1 | tee ci-evidence/contract-tests.txt
          node --version > ci-evidence/node-version.txt
          npm --version > ci-evidence/npm-version.txt
          git rev-parse HEAD > ci-evidence/commit-sha.txt

      - name: Build and verify the reviewer handoff package
        run: |
          npm run review:package -- "$RUNNER_TEMP/arexai-review"
          npm run review:verify -- "$RUNNER_TEMP/arexai-review" --commit "$GITHUB_SHA" --clean

      - name: Preserve reviewer handoff package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-package-${{ github.sha }}
          path: ${{ runner.temp }}/arexai-review/
          # This directory contains only the review builder's explicit public-file allowlist.
          # Preserve .github and .gitignore so the downloaded archive matches MANIFEST.json.
          include-hidden-files: true
          retention-days: 30

      - name: Preserve test evidence for this commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-evidence-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 30

  required-check-compatibility:
    # The repository ruleset still requires this historical check context.
    # This alias can pass only after the current behavioral test job succeeds.
    name: Hardhat 37-test suite
    needs: hardhat-tests
    runs-on: ubuntu-latest
    steps:
      - name: Confirm current contract suite passed
        run: echo "The required Hardhat behavioral suite completed successfully."
