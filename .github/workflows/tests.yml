name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardhat-tests:
    name: Hardhat 37-test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.13.0

      - name: Install exact project dependencies
        run: npm install --no-audit --no-fund

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm test
