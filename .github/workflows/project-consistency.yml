name: Published project consistency

on:
  # 06:20 Istanbul: read-only public metadata check; no wallet or transaction access.
  schedule:
    - cron: "20 3 * * *"
  pull_request:
    branches: [main]
    paths:
      - "deployments/staking-mainnet.json"
      - "scripts/verify-project-consistency.mjs"
      - "scripts/test-project-consistency.mjs"
      - "README.md"
      - ".github/workflows/project-consistency.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deployments/staking-mainnet.json'
      - 'scripts/verify-project-consistency.mjs'
      - 'scripts/test-project-consistency.mjs'
      - 'README.md'
      - '.github/workflows/project-consistency.yml'

permissions:
  contents: read

jobs:
  published-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.13.0
      - name: Install PDF text reader
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Exercise consistency checker rejection cases
        run: node --test scripts/test-project-consistency.mjs
      - name: Compare published site and whitepaper with reviewed registry
        run: node scripts/verify-project-consistency.mjs --live
