name: Publish reviewed engineering release

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - name: Read the exact reviewed source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for the protected contract and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-engineering-release.mjs
