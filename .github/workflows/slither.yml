name: Slither Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: slither-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: Slither 0.11.6
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Slither
        id: slither
        continue-on-error: true
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: .
          node-version: 22.13.0
          slither-version: 0.11.6
          sarif: results.sarif
          fail-on: medium
          slither-args: >-
             --exclude-dependencies
             --filter-paths "node_modules|contracts/mocks|contracts/verified"

      - name: Upload Slither results to GitHub Security
        if: always() && hashFiles('results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
          category: slither

      - name: Enforce medium-severity security gate
        if: steps.slither.outcome == 'failure'
        run: |
          echo "Slither reported a medium-or-higher finding or failed to analyze the contracts."
          exit 1

      - name: Preserve SARIF as downloadable commit evidence
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slither-evidence-${{ github.sha }}
          path: results.sarif
          retention-days: 30
